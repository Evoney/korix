name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: python -m pip install --upgrade pip black ruff build
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Package build
        run: python -m build
