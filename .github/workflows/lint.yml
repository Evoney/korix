name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: python -m pip install --upgrade pip black ruff build
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Package build
        run: python -m build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Check module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go tests
        run: go test ./...
      - name: Go build
        run: go build -o /tmp/korix-go ./cmd/korix-go
