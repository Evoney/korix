name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: python -m pip install --upgrade pip black ruff build
      - name: Validate tag matches project version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          pyproject = pathlib.Path("pyproject.toml")
          project = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]
          version = project["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject version {expected!r}."
              )
          print(f"Validated release tag {tag} against pyproject version {version}.")
          PY
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build distributions
        run: python -m build
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: korix-dist
          path: dist/*

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: korix-dist
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
