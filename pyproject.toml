[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korix"
version = "0.2.1"
description = "Modern terminal console for Kubernetes inspection, incident response, and guarded cluster actions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Evoney Mendonca"}
]
keywords = ["kubernetes", "kubectl", "terminal", "tui", "operations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
korix = "korix.cli:main"

[tool.setuptools]
packages = ["korix"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
